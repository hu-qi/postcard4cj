name: postcard4cj Rust oracle

on:
  push:
    branches:
      - main
    paths:
      - "interop/**"
      - ".github/workflows/postcard4cj-rust-oracle.yml"
  pull_request:
    paths:
      - "interop/**"
      - ".github/workflows/postcard4cj-rust-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interop/rust-oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain
        run: rustc --version && cargo --version

      - name: Verify Postcard 1.1.3 golden vectors
        run: |
          cargo test
          cargo run
