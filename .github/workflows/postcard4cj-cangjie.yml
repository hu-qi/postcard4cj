name: postcard4cj pure Cangjie

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "doc/**"
      - "cjpm.toml"
      - "cangjie-repo.toml.example"
      - ".gitignore"
      - "README.md"
      - "README.OpenSource"
      - "CHANGELOG.md"
      - "MIGRATION.md"
      - "API_COMPATIBILITY.md"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".github/scripts/setup-cangjie.sh"
      - ".github/scripts/resolve-cangjie-sdk-url.py"
      - ".github/workflows/postcard4cj-cangjie.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "doc/**"
      - "cjpm.toml"
      - "cangjie-repo.toml.example"
      - ".gitignore"
      - "README.md"
      - "README.OpenSource"
      - "CHANGELOG.md"
      - "MIGRATION.md"
      - "API_COMPATIBILITY.md"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".github/scripts/setup-cangjie.sh"
      - ".github/scripts/resolve-cangjie-sdk-url.py"
      - ".github/workflows/postcard4cj-cangjie.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANGJIE_PLATFORM: linux-x64
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-test:
    name: ${{ matrix.release-line }} / Cangjie ${{ matrix.cangjie-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - release-line: LTS
            cangjie-version: "1.0.5"
            sdk-sha256: ""
          - release-line: STS
            cangjie-version: "1.1.3"
            sdk-sha256: "2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a"
    env:
      CANGJIE_VERSION: ${{ matrix.cangjie-version }}
      CANGJIE_SDK_SHA256: ${{ matrix.sdk-sha256 }}
      CANGJIE_CACHE_DIR: ${{ github.workspace }}/.cache/cangjie-sdk/${{ matrix.cangjie-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Enforce pure Cangjie sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t forbidden < <(
            find . -type f \
              \( -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' -o -name 'rust-toolchain' -o -name 'rust-toolchain.toml' \) \
              -not -path './.git/*' -print
          )
          if (( ${#forbidden[@]} > 0 )); then
            printf 'Rust source/toolchain files are not allowed in postcard4cj:\n'
            printf ' - %s\n' "${forbidden[@]}"
            exit 1
          fi
          if [[ -d .cargo ]]; then
            echo '.cargo is not allowed in the pure Cangjie repository.'
            exit 1
          fi

      - name: Install native dependencies
        run: |
          sudo apt-get update --quiet=2
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet=2 \
            binutils \
            libc6-dev \
            libc++-dev \
            libffi-dev \
            libssl-dev \
            libstdc++6 \
            zlib1g-dev >/dev/null

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: .cache/cangjie-sdk/${{ matrix.cangjie-version }}
          key: cangjie-sdk-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cangjie-version }}

      - name: Install Cangjie and run checks
        shell: bash
        run: |
          LOG_FILE="${RUNNER_TEMP}/postcard4cj-cangjie-${CANGJIE_VERSION}.log"
          set +e
          (
            set -euo pipefail
            source .github/scripts/setup-cangjie.sh
            cjpm build -V
            cjpm test -V
          ) >"${LOG_FILE}" 2>&1
          STATUS=$?
          cat "${LOG_FILE}"
          exit "${STATUS}"

      - name: Upload Cangjie diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postcard4cj-cangjie-${{ matrix.release-line }}-${{ matrix.cangjie-version }}
          path: ${{ runner.temp }}/postcard4cj-cangjie-${{ matrix.cangjie-version }}.log
          if-no-files-found: error
          retention-days: 7

  coverage-benchmark-bundle:
    name: STS coverage / benchmark / bundle
    needs: build-and-test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CANGJIE_VERSION: "1.1.3"
      CANGJIE_SDK_SHA256: "2b68905afc466e665ae181595c63f96c18d75fd2c1fb6c6f0cb64e179c28d61a"
      CANGJIE_CACHE_DIR: ${{ github.workspace }}/.cache/cangjie-sdk/1.1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install native dependencies
        run: |
          sudo apt-get update --quiet=2
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet=2 \
            binutils \
            libc6-dev \
            libc++-dev \
            libffi-dev \
            libssl-dev \
            libstdc++6 \
            zlib1g-dev >/dev/null

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: .cache/cangjie-sdk/1.1.3
          key: cangjie-sdk-${{ runner.os }}-${{ runner.arch }}-1.1.3

      - name: Generate coverage, run benchmarks, and bundle
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/setup-cangjie.sh
          mkdir -p target/cjcov
          cjpm test --coverage -V | tee "${RUNNER_TEMP}/postcard4cj-coverage.log"
          cjcov --root=. --source=src --html-details --xml --json --output=target/cjcov
          cjpm bench -V | tee "${RUNNER_TEMP}/postcard4cj-benchmark.log"
          cjpm bundle -V | tee "${RUNNER_TEMP}/postcard4cj-bundle.log"

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postcard4cj-quality-artifacts
          path: |
            target/cjcov
            target/*.cjp
            target/meta-data.json
            ${{ runner.temp }}/postcard4cj-coverage.log
            ${{ runner.temp }}/postcard4cj-benchmark.log
            ${{ runner.temp }}/postcard4cj-bundle.log
          if-no-files-found: warn
          retention-days: 14
