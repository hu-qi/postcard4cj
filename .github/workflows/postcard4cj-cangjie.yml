name: postcard4cj Cangjie

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "cjpm.toml"
      - ".github/scripts/setup-cangjie.sh"
      - ".github/scripts/resolve-cangjie-sdk-url.py"
      - ".github/workflows/postcard4cj-cangjie.yml"
  pull_request:
    paths:
      - "src/**"
      - "cjpm.toml"
      - ".github/scripts/setup-cangjie.sh"
      - ".github/scripts/resolve-cangjie-sdk-url.py"
      - ".github/workflows/postcard4cj-cangjie.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANGJIE_VERSION: "1.1.3"
  CANGJIE_PLATFORM: "linux-x64"
  CANGJIE_CACHE_DIR: "${{ github.workspace }}/.cache/cangjie-sdk"
  CANGJIE_SDK_URL: "${{ vars.CANGJIE_SDK_URL }}"
  CANGJIE_SDK_SHA256: "${{ vars.CANGJIE_SDK_SHA256 }}"
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install native dependencies
        run: |
          sudo apt-get update --quiet=2
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet=2 \
            binutils \
            libc6-dev \
            libc++-dev \
            libffi-dev \
            libssl-dev \
            libstdc++6 \
            zlib1g-dev >/dev/null

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: .cache/cangjie-sdk
          key: cangjie-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.CANGJIE_VERSION }}

      - name: Install Cangjie and run checks
        shell: bash
        run: |
          LOG_FILE="${RUNNER_TEMP}/postcard4cj-cangjie.log"
          set +e
          (
            set -euo pipefail
            source .github/scripts/setup-cangjie.sh
            cjpm build -V
            cjpm test -V
          ) >"${LOG_FILE}" 2>&1
          STATUS=$?
          cat "${LOG_FILE}"
          exit "${STATUS}"

      - name: Upload Cangjie diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postcard4cj-cangjie-diagnostics
          path: ${{ runner.temp }}/postcard4cj-cangjie.log
          if-no-files-found: error
          retention-days: 7
