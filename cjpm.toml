[package]
cjc-version = "1.0.5"
name = "postcard4cj"
description = "Pure Cangjie implementation of the Postcard wire format and workspace APIs"
version = "0.1.0"
output-type = "static"
src-dir = "src"
compile-option = "-O2"
include = [
  "src",
  "doc",
  "README.md",
  "README.en.md",
  "README.OpenSource",
  "CHANGELOG.md",
  "MIGRATION.md",
  "API_COMPATIBILITY.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "NOTICE"
]
exclude = [
  "target",
  ".git",
  ".github",
  "cangjie-repo.toml",
  "src/**/*_test.cj",
  "src/**/*_test/**",
  "src/benchmark/**"
]
license = ["MIT", "Apache-2.0"]
authors = ["hu-qi contributors"]
repository = ["https://github.com/hu-qi/postcard4cj"]
